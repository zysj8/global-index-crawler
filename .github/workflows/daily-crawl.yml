name: 每日韭圈儿指数抓取
on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 拉取代码
        uses: actions/checkout@v5

      - name: 设置Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: 安装依赖 & 浏览器
        run: |
          pip install -r requirements.txt
          playwright install chromium

      - name: 运行爬虫
        run: python crawl_index.py

      - name: 提交更新文件
        uses: EndBug/add-and-commit@v10
        with:
          message: "自动更新指数数据"
          add: "index.html index_data.csv"
