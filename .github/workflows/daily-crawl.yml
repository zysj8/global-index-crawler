name: 每日全球指数抓取
on:
  schedule:
    - cron: '0 10 * * *'  # 北京时间18:00运行
  workflow_dispatch:      # 支持手动触发

jobs:
  crawl:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 明确授予写入权限
    steps:
      - name: 拉取代码
        uses: actions/checkout@v5  # 升级到支持Node.js 24的版本

      - name: 安装Python
        uses: actions/setup-python@v6  # 升级到支持Node.js 24的版本
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 执行爬虫
        run: python crawl_index.py

      - name: 提交数据
        uses: EndBug/add-and-commit@v10  # 升级到支持Node.js 24的版本
        with:
          message: '自动更新指数数据'
          add: '*.csv *.html'
