name: 每日全球指数抓取
on:
  schedule:
    - cron: '0 10 * * *'  # 北京时间18:00运行
  workflow_dispatch:      # 支持手动触发

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 执行爬虫
        run: python crawl_index.py

      - name: 提交数据
        uses: EndBug/add-and-commit@v9
        with:
          message: '自动更新指数数据'
          add: '*.csv *.html'
